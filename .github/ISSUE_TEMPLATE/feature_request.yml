name: Feature request
description: Suggest an idea or improvement for NexaMusic
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement for NexaMusic. Please explain the problem your idea would solve and how you imagine it working.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this hasn't already been requested.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of NexaMusic is this about?
      options:
        - Player
        - Playback and audio
        - Lyrics and lyrics styles
        - Library, playlists or downloads
        - Search
        - Home and Explore
        - Settings
        - Appearance and animations (Liquid Glass)
        - Accounts and integrations
        - Listen Together
        - Radio
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation where you ran into it.
      placeholder: "Right now it is difficult to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like NexaMusic to do?
      description: Describe how you think the feature should work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false

  - type: textarea
    id: extras
    attributes:
      label: Mockups or screenshots
      description: Attach images or sketches if they help explain your idea.
    validations:
      required: false

name: Bug report
description: Report a problem with NexaMusic
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve NexaMusic. Please provide as much detail as you can so the issue can be reproduced and fixed.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before you submit
      options:
        - label: I'm using the latest available NexaMusic release, or the problem also happens on the latest beta.
          required: true
        - label: I searched the existing issues and this isn't a duplicate.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Player (now playing, mini player, queue)
        - Playback (audio, streaming, crossfade)
        - Lyrics
        - Library, playlists or downloads
        - Search
        - Settings
        - Appearance and animations (Liquid Glass, themes)
        - Accounts and integrations
        - Listen Together
        - Radio
        - Widgets or notifications
        - Other
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often
        - Sometimes
        - Once or twice
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open NexaMusic
        2. Tap ...
        3. See the problem
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: What did you expect, and what happened?
      placeholder: |
        Expected: the song starts playing.
        Actual: playback does not start.
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: NexaMusic version
      description: Enter the version shown in the app's About screen or on the release you installed.
      placeholder: "0.1.0-beta.2"
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Which build are you using?
      options:
        - Beta
        - Stable release
        - Debug build
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version and device
      placeholder: "Android 15, Samsung Galaxy ..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or a screen recording
      description: Attach screenshots or a recording if they help explain the issue. Remove personal information before sharing logs.
      render: shell

name: SpotAPI service tests

on:
  push:
    branches: [main]
    paths:
      - "spotapi-service/**"
      - ".github/workflows/spotapi-service.yml"
  pull_request:
    paths:
      - "spotapi-service/**"
      - ".github/workflows/spotapi-service.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotapi-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: spotapi-service/requirements.txt
      - name: Install service dependencies
        run: |
          python -m pip install -r requirements.txt
          bash install_spotapi.sh
      - name: Run adapter tests
        run: python -m unittest discover -s tests -v

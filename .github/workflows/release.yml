name: NexaMusic Pre-release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_stable:
    name: Build Universal GMS Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret $name is missing."
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
        run: |
          set -euo pipefail
          mkdir -p app/keystore
          # Remove accidental whitespace/newlines before decoding the one-line GitHub secret.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > app/keystore/release.keystore
          if [[ ! -s app/keystore/release.keystore ]]; then
            echo "::error::Decoded release keystore is empty."
            exit 1
          fi
          echo "Decoded keystore size: $(wc -c < app/keystore/release.keystore | tr -d ' ') bytes"
          file app/keystore/release.keystore

      - name: Validate decoded JKS keystore
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list \
            -keystore app/keystore/release.keystore \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"
          echo "Release keystore format and alias validated."

      - name: Build Universal GMS Release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleUniversalGmsRelease --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Create pre-release and upload signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          VERSION_NAME=$(grep -E '^VERSION_(MAJOR|MINOR|PATCH)=' version.properties | awk -F= '
            /^VERSION_MAJOR=/ { major=$2 }
            /^VERSION_MINOR=/ { minor=$2 }
            /^VERSION_PATCH=/ { patch=$2 }
            END { printf "%s.%s.%s", major, minor, patch }
          ')
          if [[ "$RELEASE_TAG" != "v${VERSION_NAME}"* ]]; then
            echo "::error::Tag $RELEASE_TAG does not match app version $VERSION_NAME."
            exit 1
          fi

          APK_PATH="app/build/outputs/apk/universalGms/release/app-universal-gms-release.apk"
          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::Expected signed Release APK was not produced at $APK_PATH."
            find app/build/outputs/apk -type f -name '*.apk' -print
            exit 1
          fi

          APK_NAME="nexamusic-${RELEASE_TAG}.apk"
          cp "$APK_PATH" "$APK_NAME"

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            IS_PRERELEASE=$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isPrerelease --jq '.isPrerelease')
            if [[ "$IS_PRERELEASE" != "true" ]]; then
              echo "::error::Refusing to upload a beta APK to an existing non-prerelease release."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" \
              --repo "${{ github.repository }}" \
              --title "NexaMusic ${RELEASE_TAG}" \
              --notes "NexaMusic pre-release build. Please report bugs and device compatibility issues." \
              --prerelease
            exit 0
          fi

          gh release upload "$RELEASE_TAG" "$APK_NAME" --repo "${{ github.repository }}" --clobber

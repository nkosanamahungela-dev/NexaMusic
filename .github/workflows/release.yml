name: NexaMusic Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_stable:
    name: Build Universal GMS Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret $name is missing."
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
        run: |
          set -euo pipefail
          mkdir -p app/keystore
          # Remove accidental whitespace/newlines before decoding the one-line GitHub secret.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > app/keystore/release.keystore
          if [[ ! -s app/keystore/release.keystore ]]; then
            echo "::error::Decoded release keystore is empty."
            exit 1
          fi
          echo "Decoded keystore size: $(wc -c < app/keystore/release.keystore | tr -d ' ') bytes"
          file app/keystore/release.keystore

      - name: Validate decoded JKS keystore
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list \
            -keystore app/keystore/release.keystore \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"
          echo "Release keystore format and alias validated."

      - name: Build Universal GMS Release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG_VERSION_NAME="${RELEASE_TAG#v}"
          BASE_VERSION="${TAG_VERSION_NAME%%-*}"
          # Keep the installed app version clean (0.1.3) even when the
          # Git tag identifies this build as a beta (v0.1.3-beta.1).
          RELEASE_VERSION_NAME="$BASE_VERSION"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          if [[ ! "$MAJOR" =~ ^[0-9]+$ || ! "$MINOR" =~ ^[0-9]+$ || ! "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH with an optional prerelease suffix."
            exit 1
          fi
          BASE_VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          if [[ "$RELEASE_VERSION_NAME" == *-* ]]; then
            PRERELEASE_NUMBER="${RELEASE_VERSION_NAME##*.}"
            if [[ ! "$PRERELEASE_NUMBER" =~ ^[0-9]+$ ]] || (( PRERELEASE_NUMBER < 1 || PRERELEASE_NUMBER > 98 )); then
              echo "::error::Beta/preview tags must end in a sequence number from 1 to 98 (for example -beta.2)."
              exit 1
            fi
            RELEASE_VERSION_CODE=$((BASE_VERSION_CODE * 100 + PRERELEASE_NUMBER))
          else
            # Stable release sorts after all prereleases for the same base version.
            RELEASE_VERSION_CODE=$((BASE_VERSION_CODE * 100 + 99))
          fi
          ./gradlew assembleUniversalGmsRelease \
            -PreleaseVersionName="$RELEASE_VERSION_NAME" \
            -PreleaseVersionCode="$RELEASE_VERSION_CODE" \
            --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Create release and upload APK + changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          VERSION_NAME=$(grep -E '^VERSION_(MAJOR|MINOR|PATCH)=' version.properties | awk -F= '
            /^VERSION_MAJOR=/ { major=$2 }
            /^VERSION_MINOR=/ { minor=$2 }
            /^VERSION_PATCH=/ { patch=$2 }
            END { printf "%s.%s.%s", major, minor, patch }
          ')
          if [[ "$RELEASE_TAG" != "v${VERSION_NAME}"* ]]; then
            echo "::error::Tag $RELEASE_TAG does not match app version $VERSION_NAME."
            exit 1
          fi

          APK_PATH="app/build/outputs/apk/universalGms/release/app-universal-gms-release.apk"
          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::Expected signed Release APK was not produced at $APK_PATH."
            find app/build/outputs/apk -type f -name '*.apk' -print
            exit 1
          fi
          if [[ ! -s "changelog.json" ]]; then
            echo "::error::changelog.json is missing or empty."
            exit 1
          fi

          APK_NAME="nexamusic-${RELEASE_TAG}.apk"
          cp "$APK_PATH" "$APK_NAME"

          # All 0.x releases remain beta/pre-release until the project reaches 1.0.
          # Explicit prerelease suffixes are also always marked as pre-releases.
          LOWER_TAG="${RELEASE_TAG,,}"
          VERSION_MAJOR="${VERSION_NAME%%.*}"
          IS_PRERELEASE=false
          if [[ "$VERSION_MAJOR" == "0" ]] || [[ "$LOWER_TAG" =~ -(alpha|beta|rc|pre|preview|nightly)([.-]|$) ]]; then
            IS_PRERELEASE=true
          fi

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            EXISTING_PRERELEASE=$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isPrerelease --jq '.isPrerelease')
            if [[ "$EXISTING_PRERELEASE" != "$IS_PRERELEASE" ]]; then
              echo "::error::Existing release prerelease status does not match tag $RELEASE_TAG."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "$APK_NAME" changelog.json --repo "${{ github.repository }}" --clobber
          else
            if [[ "$IS_PRERELEASE" == true ]]; then
              gh release create "$RELEASE_TAG" "$APK_NAME" changelog.json \
                --repo "${{ github.repository }}" \
                --title "NexaMusic ${RELEASE_TAG}" \
                --notes "NexaMusic beta pre-release. Please report bugs and compatibility issues." \
                --prerelease
            else
              gh release create "$RELEASE_TAG" "$APK_NAME" changelog.json \
                --repo "${{ github.repository }}" \
                --title "NexaMusic ${RELEASE_TAG}" \
                --notes "NexaMusic stable release."
            fi
          fi

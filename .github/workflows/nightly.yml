name: NexaMusic Beta Release Build

on:
  # Run beta releases manually when we're ready to publish a beta.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_nightly:
    name: Build Universal GMS Release
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \\\\
            -keystore ~/.android/debug.keystore \\\\
            -storepass android \\\\
            -alias androiddebugkey \\\\
            -keypass android \\\\
            -keyalg RSA \\\\
            -keysize 2048 \\\\
            -validity 10000 \\\\
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/keystore
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::KEYSTORE secret is empty. Set it to the Base64 output of your release keystore file."
            exit 1
          fi
          # Remove line breaks/spaces in case the Base64 value was wrapped when copied.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > app/keystore/release.keystore
          if [[ ! -s app/keystore/release.keystore ]]; then
            echo "::error::KEYSTORE secret decoded to an empty file. Recreate the Base64 value from the .keystore file and update the secret."
            exit 1
          fi
          keytool -list -keystore app/keystore/release.keystore -storepass "$STORE_PASSWORD" >/dev/null
          echo "Release keystore decoded and validated."

      - name: Build Universal GMS Release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleUniversalGmsRelease assembleArm32GmsRelease -Pnightly=true -PnightlyRun=${{ github.run_number }} --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: nexamusic-gms-beta
          path: app/build/outputs/apk/universalGms/release/*.apk

      # One rolling pre-release: the tag moves to each new build and the same
      # release is updated, so the README link never changes and no tags pile up.
      - name: Publish nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^VERSION_MAJOR=//p' version.properties).$(sed -n 's/^VERSION_MINOR=//p' version.properties).$(sed -n 's/^VERSION_PATCH=//p' version.properties)
          TAG="${VERSION}-nightly"
          TITLE="NexaMusic ${VERSION} Beta"
          APK=$(find app/build/outputs/apk/universalGms/release -name '*.apk' | head -n 1)
          cp "$APK" "nexamusic-${TAG}.apk"
          APK32=$(find app/build/outputs/apk/arm32Gms/release -name '*.apk' | head -n 1)
          cp "$APK32" "nexamusic-arm32-${TAG}.apk"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          NOTES=".github/release-notes/${TAG}.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file "$NOTES" --prerelease
            gh release upload "$TAG" "nexamusic-${TAG}.apk" "nexamusic-arm32-${TAG}.apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "nexamusic-${TAG}.apk" "nexamusic-arm32-${TAG}.apk" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file "$NOTES" --prerelease --latest=false
          fi

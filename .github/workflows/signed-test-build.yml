name: Signed APK Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_signed_test:
    name: Build Signed Test APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Setup FFTW for Android
        uses: ./.github/actions/setup-fftw

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE secret"; exit 1; }
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          test -s app/keystore/release.keystore

      - name: Build signed test APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleUniversalGmsRelease --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: nexamusic-signed-test-apk
          path: app/build/outputs/apk/universalGms/release/*.apk
          if-no-files-found: error
          retention-days: 14
